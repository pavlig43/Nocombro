#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Kotlin Compose Compiler (для Compose Multiplatform)
kotlin.compose.compiler.metrics=true
org.gradle.kotlin.build.report.output=file

# Встроенный JBR Android Studio уже есть на машине. Путь добавляет его в список Gradle toolchains,
# чтобы Compose Hot Reload не искал и не скачивал отдельную среду запуска.
org.gradle.java.installations.paths=C:/Users/user/AppData/Local/Programs/Android Studio 2/jbr
